name: Deploy Doxygen Documentation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra

      - name: Generate HTML and PDF documentation
        run: |
          # Remove os badges remotos do README.md antes do Doxygen para não quebrar o LaTeX
          sed -i '/img.shields.io/d' README.md

          # Gera docs/html e docs/latex
          doxygen docs/Doxyfile

          # Remove comandos de emojis (\UTF{...}) dos arquivos .tex gerados
          sed -i 's/\\UTF{[0-9A-Fa-f]*}//g' docs/latex/*.tex || true

          # Compila o PDF em modo non-stop (3 passadas + índice para sumário e referências completas)
          cd docs/latex
          pdflatex -interaction=nonstopmode refman.tex || true
          makeindex refman.idx || true
          pdflatex -interaction=nonstopmode refman.tex || true
          pdflatex -interaction=nonstopmode refman.tex || true
          cd ../..

          # Verifica se o PDF foi realmente gerado e copia para a pasta HTML
          test -f docs/latex/refman.pdf
          cp docs/latex/refman.pdf docs/html/MMKP_Documentation.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4